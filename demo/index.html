<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>engram</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #f7f6f3; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e2e0da;
    --accent: #2f6fdf; --good: #1f8a4c; --warn: #b7791f; --bad: #c2413b; --secret: #7c3aed;
    --user-bubble: #e8eefb; --bot-bubble: #f1f0ec; --chip: #efeee9; --edge: #5b5a55; --node: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --panel: #1c1c1a; --ink: #ecebe6; --muted: #9a9890; --line: #2e2d2a;
      --accent: #7aa5f5; --good: #4cc47f; --warn: #e0a84a; --bad: #ef6f69; --secret: #b18cff;
      --user-bubble: #22324f; --bot-bubble: #262623; --chip: #2a2a27; --edge: #b9b7ae; --node: #1c1c1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  .app { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr minmax(220px, 36vh); height: 100vh; padding: 12px 16px; gap: 12px; }
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: -0.01em; }
  header .sub { color: var(--muted); font-size: 13px; }
  .top { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 12px; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 0; overflow: hidden; }

  /* chat */
  .chat { display: flex; flex-direction: column; }
  .log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 92%; padding: 8px 11px; border-radius: 10px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: var(--user-bubble); }
  .msg.bot { align-self: flex-start; background: var(--bot-bubble); }
  .meta { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .chip { font-size: 11.5px; background: var(--chip); border-radius: 999px; padding: 2px 8px; }
  .chip.updated, .chip.contradicted { color: var(--bad); }
  .chip.inserted, .chip.refined { color: var(--good); }
  .chip.duplicate { color: var(--muted); }
  .chip.dropped { color: var(--muted); text-decoration: line-through; }
  .chip.redacted { color: var(--secret); font-weight: 600; }
  form { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); }
  input[type=text] { flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font: inherit; }
  button { font: inherit; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }

  /* graph */
  .graph { position: relative; }
  .graph svg { width: 100%; height: 100%; display: block; }
  .legend { position: absolute; top: 8px; left: 10px; font-size: 11.5px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; pointer-events: none; }
  .legend span::before { content: ""; display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--edge); vertical-align: middle; margin-right: 5px; }
  .legend .l-tent::before { border-top-style: dashed; }
  .legend .l-old::before { opacity: .3; border-top-style: dotted; }
  .legend .l-sec::before { border-top-color: var(--secret); }
  .edge { fill: none; stroke: var(--edge); stroke-linecap: round; cursor: pointer; transition: opacity .6s, stroke .6s; }
  .edge.tentative { stroke-dasharray: 6 4; }
  .edge.expired { opacity: .22; stroke-dasharray: 2 4; }
  .edge.secret { stroke: var(--secret); }
  .edge.fresh { stroke: var(--good); }
  .edge.closing { stroke: var(--bad); opacity: 1; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 14; cursor: pointer; }
  .until { font-size: 10.5px; fill: var(--bad); opacity: .85; pointer-events: none; }
  .node circle { fill: var(--node); stroke: var(--edge); stroke-width: 1.5; }
  .node.user circle { stroke: var(--accent); stroke-width: 2.5; }
  .node.secret circle { stroke: var(--secret); }
  .node text { font-size: 12px; fill: var(--ink); paint-order: stroke; stroke: var(--panel); stroke-width: 3px; pointer-events: none; }
  .tip { position: absolute; max-width: 420px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18); pointer-events: none; z-index: 5; }
  .tip h4 { margin: 0 0 4px; font-size: 13px; }
  .tip table { border-collapse: collapse; width: 100%; margin-top: 6px; }
  .tip td { padding: 1px 6px 1px 0; vertical-align: top; }
  .tip td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .tip .dim { color: var(--muted); }

  /* audit */
  .audit { display: grid; grid-template-rows: auto auto 1fr; }
  .counters { display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .counter b { font-variant-numeric: tabular-nums; font-size: 15px; display: block; }
  .counter { font-size: 11.5px; color: var(--muted); }
  .counter.secret b { color: var(--secret); }
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  select { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
  .confirm { color: var(--bad); font-size: 13px; }
  .table-wrap { overflow: auto; }
  table.facts { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  table.facts th, table.facts td { text-align: left; padding: 5px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.facts td.text { white-space: normal; min-width: 220px; }
  table.facts th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 500; }
  tr.expired td { opacity: .5; }
  .badge { font-size: 10.5px; padding: 1px 6px; border-radius: 999px; background: var(--chip); margin-right: 3px; }
  .badge.redacted { color: #fff; background: var(--secret); }
  .badge.tentative { color: var(--warn); }
  .badge.expired { color: var(--bad); }
  .empty { color: var(--muted); padding: 14px; }

  @media (max-width: 820px) {
    .app { height: auto; grid-template-rows: auto auto auto; }
    .top { grid-template-columns: minmax(0, 1fr); }
    .chat { height: 60vh; }
    .graph { height: 60vh; }
    .audit { max-height: 70vh; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>engram</h1>
    <span class="sub">An LLM extracts facts. Jev decides what happens to each one. Every decision is shown.</span>
  </header>

  <div class="top">
    <section class="card chat">
      <div class="log" id="log">
        <div class="msg bot">Tell me about yourself, or ask something. Each message is stored, then answered from memory.</div>
      </div>
      <form id="form" autocomplete="off">
        <input type="text" id="input" placeholder="I moved to Berlin last month…" aria-label="Message">
        <button class="primary" id="send">Send</button>
      </form>
    </section>

    <section class="card graph" id="graph">
      <div class="legend">
        <span>current</span><span class="l-tent">tentative</span><span class="l-old">no longer true</span><span class="l-sec">credentials (redacted)</span><span>thickness = confidence</span>
      </div>
      <svg id="svg"></svg>
      <div class="tip" id="tip" hidden></div>
    </section>
  </div>

  <section class="card audit">
    <div class="counters" id="counters"></div>
    <div class="filters">
      <label>sensitivity <select id="f-sens"><option value="">all</option><option>none</option><option>health</option><option>financial</option><option>relationship</option><option>credentials</option></select></label>
      <label>kind <select id="f-kind"><option value="">all</option><option>preference</option><option>bio</option><option>event</option><option>relationship</option><option>task</option><option>opinion</option></select></label>
      <button id="del" class="danger" disabled>Delete matching</button>
      <span id="confirm" class="confirm" hidden></span>
    </div>
    <div class="table-wrap" id="facts"></div>
  </section>
</div>

<script>
const $ = (id) => document.getElementById(id);
const api = async (method, path, body) => {
  const res = await fetch(path, { method, headers: body ? { "content-type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  if (!res.ok) throw new Error(`${method} ${path}: ${res.status} ${await res.text()}`);
  return res.json();
};
const ms = (x) => x >= 1000 ? `${(x / 1000).toFixed(1)} s` : `${Math.round(x)} ms`;
const usd = (x) => x < 0.01 ? `$${x.toFixed(5)}` : `$${x.toFixed(3)}`;
const day = (iso) => iso ? iso.slice(0, 10) : "now";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

/* ---------------- chat ---------------- */
function bubble(cls, html) {
  const div = document.createElement("div");
  div.className = `msg ${cls}`;
  div.innerHTML = html;
  $("log").append(div);
  $("log").scrollTop = $("log").scrollHeight;
  return div;
}

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = $("input").value.trim();
  if (!text) return;
  $("input").value = "";
  $("send").disabled = true;
  bubble("user", esc(text));
  const pending = bubble("bot", `<span class="meta">remembering…</span>`);
  try {
    const ing = await api("POST", "/ingest", { text, speaker: "user" });
    const chips = ing.outcomes.map((o) => {
      const cls = o.redacted ? "redacted" : o.action;
      const extra = [o.closed_target ? "closed old edge" : "", o.tentative ? "tentative" : "", o.escalated ? "LLM tiebreak" : "", o.redacted ? "redacted" : ""].filter(Boolean).join(", ");
      return `<span class="chip ${cls}" title="${esc(o.text)}">${o.action}${extra ? ` · ${extra}` : ""}</span>`;
    }).join("");
    await refreshGraph(ing.outcomes);
    pending.innerHTML = `<span class="meta">answering…</span><div class="chips">${chips}</div>`;
    const ans = await api("POST", "/ask", { question: text });
    pending.innerHTML = `${esc(ans.answer)}
      <div class="chips">${chips || '<span class="chip">no new facts</span>'}</div>
      <div class="meta">extract ${ms(ing.extract_ms)} · decide ${ms(ing.decide_ms)} · retrieve ${ms(ans.retrieve_ms)} · answer ${ms(ans.latency_ms - ans.retrieve_ms)} · ${ans.memories.length} memories${ans.degraded ? " · degraded" : ""}</div>`;
  } catch (err) {
    pending.innerHTML = `<span style="color:var(--bad)">${esc(err.message)}</span>`;
  } finally {
    $("send").disabled = false;
    $("input").focus();
    refreshAudit();
  }
});

/* ---------------- graph ---------------- */
const svg = d3.select("#svg");
const zoomLayer = svg.append("g");
const edgeLayer = zoomLayer.append("g");
const labelLayer = zoomLayer.append("g");
const nodeLayer = zoomLayer.append("g");
svg.call(d3.zoom().scaleExtent([0.3, 3]).on("zoom", (e) => zoomLayer.attr("transform", e.transform)));

let nodes = [], edges = [];
const known = new Set();
const sim = d3.forceSimulation()
  .force("link", d3.forceLink().id((d) => d.id).distance(110).strength(0.5))
  .force("charge", d3.forceManyBody().strength(-380))
  .force("collide", d3.forceCollide(34))
  .on("tick", ticked);

function size() {
  const r = $("graph").getBoundingClientRect();
  sim.force("center", d3.forceCenter(r.width / 2, r.height / 2)).force("x", d3.forceX(r.width / 2).strength(0.04)).force("y", d3.forceY(r.height / 2).strength(0.06));
}
window.addEventListener("resize", () => { size(); sim.alpha(0.3).restart(); });
size();

function curve(d) {
  const s = d.source, t = d.target;
  if (s === t) return `M${s.x},${s.y} a18,18 0 1,1 1,0`;
  const dx = t.x - s.x, dy = t.y - s.y, len = Math.hypot(dx, dy) || 1;
  const off = d.offset * 26;
  const mx = (s.x + t.x) / 2 - (dy / len) * off, my = (s.y + t.y) / 2 + (dx / len) * off;
  // label point 65% of the way along the curve, toward the object, clear of the busy subject node
  const k = 0.65, a = (1 - k) * (1 - k), b = 2 * (1 - k) * k, c = k * k;
  d.mid = [a * s.x + b * mx + c * t.x, a * s.y + b * my + c * t.y];
  return `M${s.x},${s.y} Q${mx},${my} ${t.x},${t.y}`;
}

function ticked() {
  edgeLayer.selectAll("path").attr("d", curve);
  labelLayer.selectAll("text").attr("x", (d) => d.mid ? d.mid[0] : 0).attr("y", (d) => d.mid ? d.mid[1] - 4 : 0);
  nodeLayer.selectAll("g").attr("transform", (d) => `translate(${d.x},${d.y})`);
}

async function refreshGraph(outcomes = []) {
  const g = await api("GET", "/graph");
  const prev = new Map(nodes.map((n) => [n.id, n]));
  const r = $("graph").getBoundingClientRect();
  nodes = g.nodes.map((n) => Object.assign(prev.get(n.id) || { x: r.width / 2 + (Math.random() - 0.5) * 80, y: r.height / 2 + (Math.random() - 0.5) * 80 }, n));
  const secretNodes = new Set(g.edges.filter((e) => e.redacted).map((e) => e.target));

  // parallel edges between the same pair fan out
  const pairCount = new Map();
  edges = g.edges.map((e) => {
    const key = [e.source, e.target].sort().join("|");
    const i = pairCount.get(key) || 0;
    pairCount.set(key, i + 1);
    return { ...e, offset: i === 0 ? 0 : (i % 2 ? 1 : -1) * Math.ceil(i / 2) };
  });
  const fresh = new Set(edges.filter((e) => !known.has(e.id)).map((e) => e.id));
  const closing = new Set(outcomes.filter((o) => o.closed_target).map((o) => o.target_id));

  const width = (d) => 1 + d.confidence * 4;
  const edgeSel = edgeLayer.selectAll("path.edge").data(edges, (d) => d.id);
  edgeSel.exit().remove();
  const entered = edgeSel.enter().append("path").attr("class", "edge").attr("stroke-width", 0).attr("opacity", 0);
  entered.transition().duration(900).attr("stroke-width", width).attr("opacity", 1);
  const all = entered.merge(edgeSel);
  all.attr("class", (d) => ["edge", d.tentative && d.valid ? "tentative" : "", d.valid ? "" : "expired", d.redacted ? "secret" : "", fresh.has(d.id) && known.size ? "fresh" : "", closing.has(d.id) ? "closing" : ""].join(" "))
     .attr("stroke-width", width)
     .on("mousemove", showTip).on("mouseleave", hideTip);
  // highlight fades after a moment so the steady state reads cleanly
  setTimeout(() => edgeLayer.selectAll("path.edge").classed("fresh", false).classed("closing", false), 1800);

  const untilSel = labelLayer.selectAll("text").data(edges.filter((e) => !e.valid), (d) => d.id);
  untilSel.exit().remove();
  untilSel.enter().append("text").attr("class", "until").attr("text-anchor", "middle").merge(untilSel).text((d) => `valid until ${day(d.valid_until)}`);

  const nodeSel = nodeLayer.selectAll("g").data(nodes, (d) => d.id);
  nodeSel.exit().remove();
  const ng = nodeSel.enter().append("g").call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.25).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
  ng.append("circle");
  ng.append("text").attr("dy", 4);
  const allNodes = ng.merge(nodeSel);
  allNodes.attr("class", (d) => `node${d.id === "user" ? " user" : ""}${secretNodes.has(d.id) ? " secret" : ""}`);
  allNodes.select("circle").attr("r", (d) => d.id === "user" ? 14 : 8);
  allNodes.select("text").attr("x", (d) => d.id === "user" ? 18 : 12).text((d) => d.label);

  sim.nodes(nodes);
  sim.force("link").links(edges);
  sim.alpha(fresh.size ? 0.6 : 0.2).restart();
  edges.forEach((e) => known.add(e.id));
}

/* hover: the full decision trail, fetched once per fact */
const trails = new Map();
let tipFor = null;
async function showTip(event, d) {
  const tip = $("tip");
  const box = $("graph").getBoundingClientRect();
  tip.style.left = `${Math.min(event.clientX - box.left + 14, box.width - 430)}px`;
  tip.style.top = `${Math.min(event.clientY - box.top + 14, box.height - 60)}px`;
  if (tipFor === d.id && !tip.hidden) return;
  tipFor = d.id;
  tip.hidden = false;
  tip.innerHTML = `<h4>${esc(d.text)}</h4><div class="dim">loading decisions…</div>`;
  if (!trails.has(d.id)) trails.set(d.id, await api("GET", `/facts/${d.id}`));
  if (tipFor !== d.id) return;
  const f = trails.get(d.id);
  const rel = f.decisions.filter((x) => x.question === "relation_to_candidate" && x.backend !== "llm_escalation")
    .sort((a, b) => (b.chosen !== "new") - (a.chosen !== "new") || b.p - a.p).slice(0, 2);
  const rest = f.decisions.filter((x) => x.question !== "relation_to_candidate" || x.backend === "llm_escalation");
  const rows = [...rest, ...rel].map((x) => `<tr><td>${esc(x.question)}</td><td>${esc(x.chosen)}</td><td class="num">${x.backend === "rule" ? "rule" : x.p.toFixed(2)}</td><td class="dim">${esc(x.backend)}${x.backend === "jev" ? ` · ${ms(x.latency_ms)}` : ""}${x.note && x.backend === "rule" ? ` · ${esc(x.note)}` : ""}</td></tr>`).join("");
  const nRel = f.decisions.filter((x) => x.question === "relation_to_candidate").length;
  tip.innerHTML = `<h4>${esc(f.text)}</h4>
    <div class="dim">${esc(f.source)} —${esc(f.predicate)}→ ${esc(f.target)} · confidence ${f.confidence.toFixed(2)} · ${f.valid ? "valid" : "no longer true"} ${day(f.valid_from)} → ${day(f.valid_until)}${f.tentative ? " · tentative" : ""}${f.redacted ? " · redacted" : ""}</div>
    <table>${rows}</table>
    <div class="dim" style="margin-top:4px">${nRel} candidate comparisons, top ${rel.length} shown · ${f.provenance.length} source message(s)</div>`;
}
function hideTip() { $("tip").hidden = true; tipFor = null; }

/* ---------------- audit ---------------- */
let lastFacts = [];
async function refreshAudit() {
  const sens = $("f-sens").value, kind = $("f-kind").value;
  const q = new URLSearchParams(Object.entries({ sensitivity: sens, kind }).filter(([, v]) => v));
  const a = await api("GET", `/audit?${q}`);
  const c = a.counters;
  const items = [
    ["Jev decisions", c.jev_decisions], ["Jev requests", c.jev_requests], ["Jev time", ms(c.jev_latency_ms)],
    ["Jev cost", usd(c.jev_cost_usd)], ["LLM calls", c.llm_calls], ["LLM cost", usd(c.llm_cost_usd)],
    ["LLM tiebreaks", c.escalations], ["kept on request", c.user_requested], ["redactions", c.redactions, "secret"],
  ];
  $("counters").innerHTML = items.map(([k, v, cls]) => `<div class="counter ${cls || ""}"><b>${v}</b>${k}</div>`).join("");
  lastFacts = a.facts;
  $("del").disabled = !(sens || kind) || !a.facts.length;
  if (!a.facts.length) { $("facts").innerHTML = `<div class="empty">No facts${sens || kind ? " match this filter" : " yet"}.</div>`; return; }
  $("facts").innerHTML = `<table class="facts"><thead><tr><th>fact</th><th>edge</th><th>kind</th><th>sensitivity</th><th>conf.</th><th>valid</th></tr></thead><tbody>${
    a.facts.slice().reverse().map((f) => `<tr class="${f.valid ? "" : "expired"}"><td class="text">${f.redacted ? '<span class="badge redacted">redacted</span>' : ""}${f.tentative && f.valid ? '<span class="badge tentative">tentative</span>' : ""}${f.valid ? "" : '<span class="badge expired">no longer true</span>'}${esc(f.text)}</td><td>${esc(f.predicate)}</td><td>${esc(f.kind)}</td><td>${esc(f.sensitivity)}</td><td>${f.confidence.toFixed(2)}</td><td>${day(f.valid_from)} → ${day(f.valid_until)}</td></tr>`).join("")
  }</tbody></table>`;
}
$("f-sens").addEventListener("change", () => { resetConfirm(); refreshAudit(); });
$("f-kind").addEventListener("change", () => { resetConfirm(); refreshAudit(); });

// Two-step delete: the first click asks, the second deletes.
let armed = false;
function resetConfirm() { armed = false; $("confirm").hidden = true; $("del").textContent = "Delete matching"; }
$("del").addEventListener("click", async () => {
  const sens = $("f-sens").value, kind = $("f-kind").value;
  if (!armed) {
    armed = true;
    $("confirm").textContent = `Permanently delete ${lastFacts.length} fact(s)? Click again to confirm.`;
    $("confirm").hidden = false;
    $("del").textContent = "Confirm delete";
    return;
  }
  const q = new URLSearchParams(Object.entries({ sensitivity: sens, kind }).filter(([, v]) => v));
  const r = await api("DELETE", `/facts?${q}`);
  resetConfirm();
  $("confirm").textContent = `Deleted ${r.deleted} fact(s).`;
  $("confirm").hidden = false;
  await refreshGraph();
  await refreshAudit();
});

refreshGraph().then(refreshAudit);
setInterval(refreshAudit, 5000);
</script>
</body>
</html>
