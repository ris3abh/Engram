[project]
name = "engram"
version = "0.1.0"
description = "A long-term memory graph for AI agents where every decision is a typed Jev choice."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0",
    "fastapi>=0.141.1",
    "httpx[http2]>=0.28,<1",
    "networkx>=3.3",
    "numpy>=1.26",
    "openai>=3.19.0",
    "sentence-transformers>=6.1.0",
    "typer>=0.27.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
engram = "engram.cli:app"

[project.optional-dependencies]
bench = [
    "graphiti-core==0.30.2",
    "mem0ai[extras,nlp]>=2.1.0",
    "tiktoken>=0.9",
    # lean extraction arms: sentence splitting
    "spacy>=3.8",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the spaCy model wheel (bench extra)

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[dependency-groups]
dev = ["pytest>=8.4,<9", "pytest-asyncio>=0.24", "ruff>=0.14,<1"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
exclude = ["src/engram/llm/prompts_mem0.py"]  # verbatim mem0 source

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m \"not live\""
markers = ["live: hits a paid external API; skipped unless the key is set"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.per-file-ignores]
"bench/locomo_subset.py" = ["E501", "W291"]  # verbatim third-party prompts
"src/engram/llm/prompts_mem0.py" = ["E501", "W291", "W293", "UP017"]  # verbatim third-party code; never rewrite
