<svg xmlns="http://www.w3.org/2000/svg" width="420" height="560" viewBox="0 0 420 560">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7A8496"/></marker></defs>
<style>text{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif}.t{font-size:14px;font-weight:700}.b{font-size:12px}.e{font-size:12px;font-style:italic}.q{font-size:13px;font-weight:700}</style>
<rect width="420" height="560" fill="white"/>
<rect x="10" y="8" width="400" height="40" rx="10" fill="#FAFBFE" stroke="#D5DAE3"/>
<text x="22" y="33" class="q" fill="#1F2430">Query: "where did the user live before Berlin"</text>
<rect x="10" y="64" width="400" height="82" rx="12" fill="#F5F7FA" stroke="#8A94A6" stroke-width="1.6"/>
<text x="24" y="88" class="t" fill="#1F2430">1  Cosine recall</text>
<text x="24" y="109" class="b" fill="#4B5566">top-k by embedding, over all facts</text>
<text x="24" y="131" class="e" fill="#4B5566">e.g. closed facts such as Paris can enter here</text>
<path d="M210,146 L210,160" stroke="#7A8496" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="10" y="162" width="400" height="82" rx="12" fill="#EEF0FF" stroke="#4453C4" stroke-width="1.6"/>
<text x="24" y="186" class="t" fill="#1F2430">2  Listwise relevance (Jev)</text>
<text x="24" y="207" class="b" fill="#2F3A99">one yes/no relevance question per candidate</text>
<text x="24" y="229" class="e" fill="#4B5566">e.g. ranks the candidates</text>
<path d="M210,244 L210,258" stroke="#7A8496" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="10" y="260" width="400" height="82" rx="12" fill="#EEF0FF" stroke="#4453C4" stroke-width="1.6"/>
<text x="24" y="284" class="t" fill="#1F2430">3  Query-relation pull (Jev)</text>
<text x="24" y="305" class="b" fill="#2F3A99">query_relation at p ≥ 0.85 adds same-relation facts</text>
<text x="24" y="327" class="e" fill="#4B5566">e.g. query_relation = lives_in (asserted by the test)</text>
<path d="M210,342 L210,356" stroke="#7A8496" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="10" y="358" width="400" height="82" rx="12" fill="#E9F7F0" stroke="#2E9E6B" stroke-width="1.6"/>
<text x="24" y="382" class="t" fill="#1F2430">4  History expansion</text>
<text x="24" y="403" class="b" fill="#1D7350">adds each hit&#x27;s superseded chain</text>
<text x="24" y="425" class="e" fill="#4B5566">e.g. Berlin&#x27;s chain adds Paris</text>
<path d="M210,440 L210,454" stroke="#7A8496" stroke-width="1.8" marker-end="url(#a)"/>
<rect x="10" y="456" width="400" height="82" rx="12" fill="#FFF3EA" stroke="#E8762C" stroke-width="1.6"/>
<text x="24" y="480" class="t" fill="#1F2430">5  Compact rendering → answer</text>
<text x="24" y="501" class="b" fill="#B8561A">date said · fact · source quote</text>
<text x="24" y="523" class="e" fill="#4B5566">e.g. Paris shown as no longer true</text>
</svg>